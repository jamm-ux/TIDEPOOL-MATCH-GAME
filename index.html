<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tidepool Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep: #0B3D3A;
    --deeper: #082B29;
    --foam: #4ECDC4;
    --coral: #FF6B5B;
    --sand: #F4E9D8;
    --gold: #E9C46A;
    --card-back: #0F4A45;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(ellipse at top, #124B47 0%, var(--deep) 45%, var(--deeper) 100%);
    font-family:'Space Grotesk', sans-serif;
    color: var(--sand);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
    position:relative;
    padding: 32px 16px 60px;
  }

  /* ambient bubbles */
  .bubbles{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
  .bubble{
    position:absolute; bottom:-40px; border-radius:50%;
    background: radial-gradient(circle at 30% 30%, rgba(78,205,196,0.55), rgba(78,205,196,0.05));
    animation: rise linear infinite;
  }
  @keyframes rise{
    0%{ transform: translateY(0) translateX(0); opacity:0; }
    10%{ opacity:0.8; }
    100%{ transform: translateY(-115vh) translateX(var(--drift, 20px)); opacity:0; }
  }

  header{
    position:relative; z-index:1;
    text-align:center;
    margin-bottom: 22px;
  }
  .eyebrow{
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--foam);
    font-weight:600;
    margin-bottom: 6px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: clamp(34px, 6vw, 54px);
    letter-spacing: -0.01em;
    color: var(--sand);
  }
  h1 span{ color: var(--coral); font-style: italic; font-weight:500;}
  .sub{
    margin-top: 8px;
    color: rgba(244,233,216,0.7);
    font-size: 15px;
    max-width: 420px;
  }

  .stats{
    position:relative; z-index:1;
    display:flex; gap: 14px;
    margin-bottom: 26px;
    flex-wrap: wrap;
    justify-content:center;
  }
  .stat{
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(78,205,196,0.25);
    border-radius: 14px;
    padding: 10px 20px;
    min-width: 92px;
    text-align:center;
  }
  .stat .label{
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(244,233,216,0.55);
    margin-bottom: 4px;
  }
  .stat .value{
    font-family:'Fraunces', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--gold);
  }

  .board{
    position:relative; z-index:1;
    display:grid;
    grid-template-columns: repeat(4, minmax(64px, 88px));
    gap: 12px;
    perspective: 1000px;
  }
  @media (min-width: 520px){
    .board{ grid-template-columns: repeat(4, 92px); gap: 14px; }
  }

  .card{
    width: 100%;
    aspect-ratio: 1;
    position:relative;
    cursor:pointer;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(.2,.9,.3,1.15);
  }
  .card.flipped, .card.matched{ transform: rotateY(180deg); }
  .card.matched{ cursor:default; }
  .face{
    position:absolute; inset:0;
    border-radius: 14px;
    display:flex; align-items:center; justify-content:center;
    backface-visibility:hidden;
    font-size: clamp(26px, 5vw, 36px);
  }
  .face.back{
    background: linear-gradient(145deg, var(--card-back), #0A3936);
    border: 1px solid rgba(78,205,196,0.3);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
  }
  .face.back::after{
    content:"~";
    color: rgba(78,205,196,0.5);
    font-size: 22px;
    font-family:'Fraunces', serif;
  }
  .face.front{
    background: var(--sand);
    color: var(--deep);
    transform: rotateY(180deg);
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  }
  .card.matched .face.front{
    background: linear-gradient(145deg, var(--foam), #3AB6AC);
    animation: pop 0.4s ease;
  }
  @keyframes pop{
    0%{ transform: rotateY(180deg) scale(1); }
    50%{ transform: rotateY(180deg) scale(1.12); }
    100%{ transform: rotateY(180deg) scale(1); }
  }
  .card:not(.flipped):not(.matched):hover .face.back{
    border-color: rgba(78,205,196,0.6);
  }

  .controls{
    position:relative; z-index:1;
    margin-top: 30px;
    display:flex; gap: 12px;
    align-items:center;
  }
  button{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size: 14px;
    padding: 12px 24px;
    border-radius: 999px;
    border: none;
    cursor:pointer;
    background: var(--coral);
    color: var(--deeper);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button:hover{ transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,107,91,0.35); }
  button:focus-visible{ outline: 2px solid var(--gold); outline-offset:3px; }
  .difficulty{
    display:flex; gap:6px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(78,205,196,0.25);
    border-radius: 999px;
    padding: 4px;
  }
  .difficulty button{
    background:transparent;
    color: rgba(244,233,216,0.7);
    padding: 8px 14px;
    font-size: 12px;
  }
  .difficulty button.active{
    background: var(--foam);
    color: var(--deeper);
  }
  .difficulty button:hover{ box-shadow:none; transform:none; }

  .win-overlay{
    position:fixed; inset:0; z-index: 5;
    background: rgba(8,38,36,0.88);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity 0.35s ease;
  }
  .win-overlay.show{ opacity:1; pointer-events:auto; }
  .win-card{
    background: var(--deep);
    border: 1px solid rgba(78,205,196,0.35);
    border-radius: 20px;
    padding: 40px 36px;
    text-align:center;
    max-width: 340px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .win-card h2{
    font-family:'Fraunces', serif;
    font-size: 30px;
    color: var(--gold);
    margin-bottom: 8px;
  }
  .win-card p{
    color: rgba(244,233,216,0.75);
    font-size: 14px;
    margin-bottom: 20px;
  }
  .win-stats{
    display:flex; justify-content:center; gap:20px;
    margin-bottom: 24px;
  }
  .win-stats div .value{ font-family:'Fraunces', serif; font-size:22px; color:var(--foam); }
  .win-stats div .label{ font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(244,233,216,0.5); }

  footer{
    position:relative; z-index:1;
    margin-top: 34px;
    font-size: 12px;
    color: rgba(244,233,216,0.4);
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    .bubble{ animation: none; display:none; }
    .card{ transition: none; }
  }
</style>
</head>
<body>

<div class="bubbles" id="bubbles"></div>

<header>
  <div class="eyebrow">A Small Web Game</div>
  <h1>Tidepool <span>Match</span></h1>
  <p class="sub">Flip two stones at a time. Find every pair hiding in the pool before your moves run high.</p>
</header>

<div class="stats">
  <div class="stat"><div class="label">Time</div><div class="value" id="timer">0:00</div></div>
  <div class="stat"><div class="label">Moves</div><div class="value" id="moves">0</div></div>
  <div class="stat"><div class="label">Best</div><div class="value" id="best">—</div></div>
</div>

<div class="board" id="board"></div>

<div class="controls">
  <button id="restart">Shuffle Again</button>
  <div class="difficulty">
    <button data-size="4" class="active">4×4</button>
    <button data-size="6">6×4</button>
  </div>
</div>

<footer>Made for the Final Task — a couple pairs left never hurt anyone.</footer>

<div class="win-overlay" id="winOverlay">
  <div class="win-card">
    <h2>Pool Cleared!</h2>
    <p>Every creature found its match.</p>
    <div class="win-stats">
      <div><div class="value" id="winTime">0:00</div><div class="label">Time</div></div>
      <div><div class="value" id="winMoves">0</div><div class="label">Moves</div></div>
    </div>
    <button id="playAgain">Dive Again</button>
  </div>
</div>

<script>
  const ICONS = ['🐙','🦀','🐠','🦑','🐢','🦈','🐬','🪼','⭐','🐚','🦐','🐡'];

  const board = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const timerEl = document.getElementById('timer');
  const bestEl = document.getElementById('best');
  const winOverlay = document.getElementById('winOverlay');
  const winTime = document.getElementById('winTime');
  const winMoves = document.getElementById('winMoves');

  let state = {
    cards: [],
    flipped: [],
    matched: 0,
    moves: 0,
    seconds: 0,
    timerId: null,
    started: false,
    cols: 4,
    pairCount: 8
  };

  // best scores kept in memory for this session only, per difficulty
  const bestScores = {};

  function makeBubbles(){
    const container = document.getElementById('bubbles');
    container.innerHTML = '';
    for(let i=0;i<18;i++){
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = 6 + Math.random()*22;
      b.style.width = size+'px';
      b.style.height = size+'px';
      b.style.left = Math.random()*100+'vw';
      b.style.setProperty('--drift', (Math.random()*60-30)+'px');
      b.style.animationDuration = (8+Math.random()*10)+'s';
      b.style.animationDelay = (Math.random()*10)+'s';
      container.appendChild(b);
    }
  }

  function buildDeck(pairCount){
    const chosen = ICONS.slice(0, pairCount);
    const deck = [...chosen, ...chosen];
    for(let i=deck.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    return deck;
  }

  function render(){
    board.innerHTML = '';
    board.style.gridTemplateColumns = `repeat(${state.cols}, minmax(64px, 92px))`;
    state.cards.forEach((icon, idx)=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = idx;
      card.innerHTML = `
        <div class="face back"></div>
        <div class="face front">${icon}</div>
      `;
      card.addEventListener('click', ()=> onCardClick(idx, card));
      board.appendChild(card);
    });
  }

  function onCardClick(idx, el){
    if(el.classList.contains('flipped') || el.classList.contains('matched')) return;
    if(state.flipped.length === 2) return;

    if(!state.started){
      state.started = true;
      state.timerId = setInterval(()=>{
        state.seconds++;
        timerEl.textContent = formatTime(state.seconds);
      }, 1000);
    }

    el.classList.add('flipped');
    state.flipped.push({idx, el});

    if(state.flipped.length === 2){
      state.moves++;
      movesEl.textContent = state.moves;
      const [a, b] = state.flipped;
      if(state.cards[a.idx] === state.cards[b.idx]){
        a.el.classList.add('matched');
        b.el.classList.add('matched');
        state.flipped = [];
        state.matched++;
        if(state.matched === state.pairCount){
          finishGame();
        }
      } else {
        setTimeout(()=>{
          a.el.classList.remove('flipped');
          b.el.classList.remove('flipped');
          state.flipped = [];
        }, 750);
      }
    }
  }

  function formatTime(s){
    const m = Math.floor(s/60);
    const r = s%60;
    return `${m}:${r.toString().padStart(2,'0')}`;
  }

  function finishGame(){
    clearInterval(state.timerId);
    const key = state.cols;
    if(!bestScores[key] || state.moves < bestScores[key]){
      bestScores[key] = state.moves;
    }
    bestEl.textContent = bestScores[key];
    winTime.textContent = formatTime(state.seconds);
    winMoves.textContent = state.moves;
    setTimeout(()=> winOverlay.classList.add('show'), 400);
  }

  function newGame(cols){
    clearInterval(state.timerId);
    state.cols = cols || state.cols;
    state.pairCount = state.cols === 4 ? 8 : 12;
    state.cards = buildDeck(state.pairCount);
    state.flipped = [];
    state.matched = 0;
    state.moves = 0;
    state.seconds = 0;
    state.started = false;
    movesEl.textContent = '0';
    timerEl.textContent = '0:00';
    bestEl.textContent = bestScores[state.cols] ?? '—';
    winOverlay.classList.remove('show');
    render();
  }

  document.getElementById('restart').addEventListener('click', ()=> newGame());
  document.getElementById('playAgain').addEventListener('click', ()=> newGame());

  document.querySelectorAll('.difficulty button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.difficulty button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      newGame(parseInt(btn.dataset.size, 10));
    });
  });

  makeBubbles();
  newGame(4);
</script>

</body>
</html>
